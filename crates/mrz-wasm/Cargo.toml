[package]
name = "mrz-wasm"
version.workspace = true
edition.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mrz = { path = "../mrz", features = ["serde"] }
wasm-bindgen = "0.2"
serde_json = "1"

# Current Rust stable emits bulk-memory ops (memory.copy) and sign-extension
# ops (i32.extend8_s, from inlining decisions that vary build to build);
# enable both in wasm-pack's bundled wasm-opt so the release optimization
# pass validates regardless of which ops a given build happens to emit.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-sign-ext']
