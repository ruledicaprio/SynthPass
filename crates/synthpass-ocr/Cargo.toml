[package]
name = "synthpass-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
synthpass-core = { path = "../synthpass-core", features = ["security"] }
# The zero-dep ICAO 9303 engine, used here only as the checksum oracle that
# decides whether the MRZ retry passes need to run (see src/lib.rs).
mrz = { path = "../mrz" }
ocrs = "0.12.2"
rten = "0.24.0"
image = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
serde_json = "1"
# Already a build-dependency above (build.rs verifies the .rten model
# checksums) and already in the lockfile, so this adds nothing to the shipped
# crate's dependency graph. examples/corpus_manifest.rs uses it to key each
# corpus row by content, which is what lets a rerun skip re-OCRing an image
# that has not changed — a full pass over the corpus is tens of minutes.
sha2 = "0.11"

[features]
# Bakes both .rten weight files into the binary via `include_bytes!` instead
# of fetching them at runtime — see build.rs and src/embedded.rs. Off by
# default (glibc dev/CI keeps the fast runtime-download-and-cache loop); the
# musl release build turns this on for a true air-gapped single-file binary
# (see knowledge/ARCHITECTURE.md §10).
embedded-models = []
