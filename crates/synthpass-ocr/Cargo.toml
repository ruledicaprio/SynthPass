[package]
name = "synthpass-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
synthpass-core = { path = "../synthpass-core", features = ["security"] }
# Deterministic preprocessing + layout geometry, extracted so the browser demo
# runs this exact code through mrz-wasm instead of a hand-written JS port.
synthpass-imageprep = { path = "../synthpass-imageprep" }
# The zero-dep ICAO 9303 engine, used here only as the checksum oracle that
# decides whether the MRZ retry passes need to run (see src/lib.rs).
mrz = { path = "../mrz" }
ocrs = "0.13.1"
rten = "0.26.0"
image = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
serde_json = "1"
# Already a build-dependency above (build.rs verifies the .rten model
# checksums) and already in the lockfile, so this adds nothing to the shipped
# crate's dependency graph. examples/corpus_manifest.rs uses it to key each
# corpus row by content, which is what lets a rerun skip re-OCRing an image
# that has not changed — a full pass over the corpus is tens of minutes.
sha2 = "0.11"
# examples/probe_matrix.rs's synthetic grid-origin measurement (PR-3.0) needs
# documents whose true MRZ pixel geometry is known exactly, which only a
# generator can provide — no real specimen's true origin/pitch is recorded
# anywhere. Dev-only; `crates/synthpass-bench/tests/chargrid_repair_synthetic.rs`
# already depends on this crate the same way, for the same reason.
synthpass-gen = { path = "../synthpass-gen" }
# `ocrs::OcrEngine::detect_words`/`find_text_lines`/`prepare_recognition_input`
# all name `rten_imageproc::RotatedRect` in their public signatures, but `ocrs`
# does not re-export it (see `crates/synthpass-imageprep/src/geometry.rs`'s
# module doc for the same fact, and why that crate invented `BBox` instead of
# depending on this one). examples/probe_matrix.rs needs to *construct*
# `RotatedRect`s itself (synthetic per-cell/context-window crop regions), which
# `BBox` cannot express, so it names the type directly. Already present in the
# lockfile at this exact version via `ocrs`/`rten`'s own dependency graph —
# dev-only, so this adds nothing to the shipped crate.
rten-imageproc = "0.26.0"
# Same rationale as `rten-imageproc` above: `rten::Model::run_one` and the
# tensor reshape/permute/slice calls examples/probe_matrix.rs needs to drive
# it directly are all `rten_tensor` types already in the lockfile via `rten`
# itself. Dev-only.
rten-tensor = "0.26.0"

[features]
# Bakes both .rten weight files into the binary via `include_bytes!` instead
# of fetching them at runtime — see build.rs and src/embedded.rs. Off by
# default (glibc dev/CI keeps the fast runtime-download-and-cache loop); the
# musl release build turns this on for a true air-gapped single-file binary
# (see knowledge/ARCHITECTURE.md §10).
embedded-models = []

# Keep the manifest cache regression tests in the default workspace test suite.
[[example]]
name = "corpus_manifest"
test = true

# Same reason as `corpus_manifest` above. probe_matrix carries a test pinning
# CTC labels 29/44/49 against `ocrs` 0.12.2's private `DEFAULT_ALPHABET`, which
# it has to duplicate because `ocrs` never exposes it. Every figure the probe
# reports is an index into that table, so if upstream reorders it the numbers
# silently become a different question's answer. Without `test = true` the
# guard is built but never run, which is the same as not having it.
[[example]]
name = "probe_matrix"
test = true
