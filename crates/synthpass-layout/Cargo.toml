[package]
name = "synthpass-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
# Application code, never published: `mrz` is the only crate on crates.io.
publish = false

[dependencies]
# `ValidatedLayout::try_from_spec` is the only way to a layout the renderer
# accepts (ADR-0022 Decision 5); this crate parses and hands it a `LayoutSpec`.
# `embedded-fonts` because the fit check needs the font to measure glyphs.
synthpass-gen = { path = "../synthpass-gen", features = ["embedded-fonts"] }
# Derive for the two file structs (`deny_unknown_fields` at both levels);
# `synthpass-gen` stays free of serde (ADR-0007).
serde = { version = "1", features = ["derive"] }
# The JSON parser, with line and column in its errors.
serde_json = "1"
# The layout identity: SHA-256 over `ValidatedLayout::canonical_bytes()`
# (ADR-0022 Decision 7), same version as the rest of the workspace.
sha2 = "0.11"
