[package]
name = "synthpass-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# Application code, never published: `mrz` is the only crate on crates.io.
publish = false
description = "The `synthpass` command-line binary: offline passport/MRZ extraction, license tools, and the synthetic-corpus generate/export commands."

[[bin]]
name = "synthpass"
path = "src/main.rs"

[dependencies]
synthpass-pipeline = { path = "../synthpass-pipeline" }
synthpass-core = { path = "../synthpass-core", features = ["security"] }
synthpass-license = { path = "../synthpass-license" }
# Only needed here for `synthpass doctor`'s model-file/checksum check; the actual
# OCR call goes through synthpass-pipeline.
synthpass-ocr = { path = "../synthpass-ocr", optional = true }
# `synthpass generate` — synthetic passport image + label-JSON factory (M3). No
# real PII, so this command is explicitly exempt from the license gate.
synthpass-gen = { path = "../synthpass-gen" }
# `synthpass export` — synthetic-corpus → training-dataset exporter (M6, ADR-0007).
# Gated on the license `export` feature.
synthpass-export = { path = "../synthpass-export" }
image = { workspace = true }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["ocr-native-rust"]
ocr-native-rust = ["dep:synthpass-ocr"]
# Bake the .rten OCR models into the binary at compile time — see
# synthpass-pipeline/synthpass-ocr and knowledge/ARCHITECTURE.md §10. Only used by the musl
# release build.
ocr-embedded = ["synthpass-pipeline/ocr-embedded"]
# `synthpass fetch-models` actually downloads (issue #491) instead of only
# printing the pinned URL/SHA-256 for a manual fetch — off by default, so the
# default binary has no `reqwest` in its dependency graph and cannot download
# anything, ever. See crates/synthpass-ocr/src/download.rs's module doc.
download = ["synthpass-ocr?/download", "synthpass-pipeline/download"]

[dev-dependencies]
base64 = "0.23"
# Signs throwaway test licenses directly (not via synthpass-license's `vendor`
# feature — synthpass-cli must never build with that active, in any mode, so the
# shipped binary's dependency tree stays provably signing-free; see
# tests/license_roundtrip.rs).
ed25519-dalek = "3"
