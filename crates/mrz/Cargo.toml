[package]
name = "mrz"
# Decoupled from the workspace `1.6.0`: independent public-release line.
#
# Under Cargo's 0.x rules the *minor* slot is the breaking slot. `MrzData`,
# `Checks` and `Format` are `#[non_exhaustive]`, so growing them is a patch
# (0.5.1); the five emit-side `*Fields` input structs are deliberately
# exhaustive, so adding a field to one of those is breaking (0.6.0). CI diffs
# this crate against its published baseline and fails a PR whose API change
# outruns the version below — see the `semver` job and CONTRIBUTING.md.
version = "0.8.2"
edition.workspace = true
# Verified floor for the zero-dependency default build, which is the whole of
# this crate's own source: `std::iter::repeat_n` (checksum.rs) and
# `Option::is_none_or` (checksum.rs) both stabilized in 1.82. Raising it is a
# minor version bump. CI enforces it (see the `msrv` job).
#
# Scoped to this package deliberately: the rest of the workspace is unpublished
# application code with heavier dependencies and no compatibility promise. The
# optional `serde` feature follows its own upstream MSRV, which is below this
# floor (checked: `cargo +1.82.0 check -p mrz --all-features` builds it). The
# `zeroize` feature is capped below (see the dependency comment) so that it
# does *not* need its own exemption: `cargo check -p mrz --all-features` holds
# to 1.82 too, and CI's `msrv` job checks both surfaces.
rust-version = "1.82"
description = "Zero-dependency (by default) ICAO 9303 Machine Readable Zone (MRZ) parser, emitter, and check-digit validator for TD1/TD2/TD3 and MRV-A/MRV-B (visa) documents."
license = "MIT"
repository = "https://github.com/ruledicaprio/SynthPass"
documentation = "https://docs.rs/mrz"
readme = "README.md"
keywords = ["mrz", "icao", "passport", "9303", "ocr"]
categories = ["parser-implementations", "text-processing"]

# Render the `serde` and `zeroize` feature surfaces on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
# Optional, mirrors the `serde` feature above: keeps this crate zero-dep by
# default so it compiles cleanly to wasm32-unknown-unknown for the browser
# demo (mrz-wasm never enables this feature).
#
# Capped below 1.9: zeroize 1.9.0 (2026-06-12) raised its own rust-version to
# 1.85 and moved to edition 2024, which cargo 1.82 cannot even parse — so an
# uncapped range breaks `cargo check -p mrz --all-features` on this crate's
# declared MSRV even though the crate's own zero-dependency source never
# changed. 1.8.2 (2025-09-29, 1.8.0 is yanked) is the newest release still on
# edition 2021 / rust-version 1.60, so it's the newest release the range admits.
# Lift this cap only once mrz's own `rust-version` above reaches 1.85.
zeroize = { version = ">=1.8.1, <1.9", features = ["derive"], optional = true }
# Not used directly by this crate's source — zeroize's own `derive` feature
# (above) is what pulls this in and re-exports its macros as `zeroize::Zeroize`
# / `zeroize::ZeroizeOnDrop`. Declared here anyway, purely to cap the version:
# zeroize 1.8.2 accepts `zeroize_derive ^1.3`, and without this entry Cargo's
# resolver picks the newest match, 1.5.0 — which has the same edition-2024 /
# rust-version-1.85 problem as zeroize 1.9.0 above. 1.4.3 is the newest
# edition-2021 release. Remove this entry if it ever stops being needed (e.g.
# a future zeroize requires a version floor that already excludes 1.5.0).
zeroize_derive = { version = ">=1.4, <1.5", optional = true }

[features]
serde = ["dep:serde"]
zeroize = ["dep:zeroize", "dep:zeroize_derive"]

[dev-dependencies]
# Property-based "never panics on arbitrary input" regression suite (see
# tests/fuzz_props.rs). Dev-only: doesn't ship, doesn't affect the
# wasm32-unknown-unknown zero-dep build.
proptest = "1"
# Drives the `serde` round-trip test (tests/serde_roundtrip.rs, gated on the
# `serde` feature). Dev-only — not a published dependency.
serde_json = "1"
