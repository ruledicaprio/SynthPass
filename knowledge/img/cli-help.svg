<text x="18" y="267" xml:space="preserve">│                                                                            │</text>
<text x="18" y="286" xml:space="preserve">│  Offline ICAO 9303 ID extraction — zero cloud calls, air-gapped by design  │</text>
<text x="18" y="305" xml:space="preserve">│                                                                            │</text>
<text x="18" y="324" xml:space="preserve">│    [ MRZ TIER-1 ]  [ LLM TIER-2 ]  [ ED25519 LICENSE ]  [ AIR-GAPPED ]     │</text>
<text x="18" y="343" xml:space="preserve">│                                                                            │</text>
<text x="18" y="362" xml:space="preserve">└────────────────────────────────────────────────────────────────────────────┘</text>
<text x="18" y="400" xml:space="preserve">synthpass v1.6.1  |  github.com/ruledicaprio/SynthPass</text>
<text x="18" y="419" xml:space="preserve">------------------------------------------------------------------------------</text>
<text x="18" y="457" xml:space="preserve">Commands</text>
<text x="18" y="476" xml:space="preserve">  synthpass &lt;path_to_image&gt;          extract (needs a license — see below)</text>
<text x="18" y="495" xml:space="preserve">  synthpass batch &lt;dir|glob&gt;         extract every image in a directory or matching a glob</text>
<text x="18" y="514" xml:space="preserve">                                     (needs the license 'batch' feature; emits one JSON per input + a summary)</text>
<text x="18" y="533" xml:space="preserve">  synthpass decrypt &lt;file.json.enc&gt;  decrypt (needs SYNTHPASS_KEY)</text>
<text x="18" y="552" xml:space="preserve">  synthpass doctor                   preflight: OCR/inferer/license, config sanity</text>
<text x="18" y="571" xml:space="preserve">  synthpass fingerprint              print this machine's fingerprint (send to your vendor)</text>
<text x="18" y="590" xml:space="preserve">  synthpass verify-license [path]    verify a license file (default: SYNTHPASS_LICENSE_PATH or ./license.mlis)</text>
<text x="18" y="609" xml:space="preserve">  synthpass generate [--count N] [--seed N] [--profile NAME] [--document-type TYPE] [--out-dir DIR]</text>
<text x="18" y="628" xml:space="preserve">                                     generate synthetic td1|td2|td3|mrva|mrvb document images + label JSON (no license required)</text>
<text x="18" y="647" xml:space="preserve">  synthpass export --format jsonl|hf [--count N] [--seed N] [--document-type TYPE] [--pack-pages N] --out-dir DIR</text>
<text x="18" y="666" xml:space="preserve">                                     export a synthetic corpus as a training dataset (needs the license 'export' feature; see knowledge/EXPORTS.md)</text>
<text x="18" y="685" xml:space="preserve">  synthpass --help, -h               show this message</text>
<text x="18" y="704" xml:space="preserve">  synthpass --version, -V            show the version</text>
<text x="18" y="742" xml:space="preserve">No license yet? Run `synthpass fingerprint` and contact your vendor, or set</text>
<text x="18" y="761" xml:space="preserve">SYNTHPASS_LICENSE_SKIP=1 to bypass the gate for local development.</text>
</g>
