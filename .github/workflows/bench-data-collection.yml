name: Bench data collection

# Nightly, unattended data collection for future RL/auto-tuning work on
# synthpass-gen's degrade parameters. This workflow does NOT tune anything —
# it only runs the existing M4 `synthpass-bench` corpus runner against a
# fresh, never-before-seen seed range each day and appends the per-document
# (seed, profile, hit/miss, reason) outcomes to a growing dataset. Generation is
# fully deterministic from `seed` at a given commit, so each row's `(seed,
# git_sha)` is enough for a future training/tuning loop to rebuild that commit
# and reconstruct the exact document and its degrade parameters on demand. A
# generator change (#411's MRZ geometry, for one) renders a different document
# for the same seed on either side of it.
#
# Writes to a dedicated `bench-data` branch (not `main`, which is protected —
# see CONTRIBUTING.md) so this can push automatically without a PR per run.

on:
  schedule:
    - cron: "17 3 * * *" # ~daily, off the hour to avoid GitHub's cron rush
  workflow_dispatch:
    inputs:
      count:
        description: "Documents to check this run"
        default: "200"

permissions:
  contents: write

concurrency:
  group: bench-data-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect bench data (clean + degraded profiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config clang libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: Cache OCR .rten models
        uses: actions/cache@v6
        with:
          path: |
            text-detection.rten
            text-recognition.rten
          key: ocrs-rten-models-v1

      - name: Download + checksum-verify the OCR .rten models
        run: |
          for f in text-detection.rten text-recognition.rten; do
            if [ ! -f "$f" ]; then
              curl -fL --retry 3 -o "$f" "https://ocrs-models.s3-accelerate.amazonaws.com/$f"
            fi
          done
          echo "f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca  text-detection.rten" | sha256sum -c -
          echo "e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e  text-recognition.rten" | sha256sum -c -

      # Must run BEFORE the seed window is picked: the window continues from
      # what the dataset already contains.
      - name: Checkout or create the bench-data branch
        run: |
          git fetch origin bench-data || true
          if git ls-remote --exit-code --heads origin bench-data >/dev/null 2>&1; then
            git worktree add data-branch origin/bench-data
            cd data-branch && git checkout -B bench-data
          else
            git worktree add --detach data-branch
            cd data-branch
            git checkout --orphan bench-data
            git rm -rf . >/dev/null 2>&1 || true
          fi

      # A fresh, monotonically-increasing seed window, continuing from the
      # highest seed the dataset already holds. Every run therefore covers
      # documents neither a previous run nor the M4 CI gate has seen.
      #
      # This used to be `days_since_epoch * count`, which silently assumed one
      # run per UTC day. On 2026-07-25 a manual workflow_dispatch landed
      # alongside the scheduled run, both drew the identical window, and 200
      # duplicate (seed, profile) rows entered the corpus — 12% of it at the
      # time. The commit guard below could not catch it: git_sha, timestamp and
      # elapsed_ms differ, so the lines are textually new even though the
      # documents measured are the same. Deriving the window from the data
      # itself rather than from the calendar has no such assumption, and
      # self-heals if a run is missed, retried, or dispatched by hand.
      - name: Pick this run's seed window
        id: seed
        # The dispatch input reaches the script through the environment, never
        # through `${{ }}` inside `run:`, which would splice it into the shell
        # source.
        env:
          COUNT_INPUT: ${{ github.event.inputs.count }}
        run: |
          count="${COUNT_INPUT:-200}"
          if ! [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::count must be a positive integer, got '$count'"
            exit 1
          fi
          if [ -s data-branch/dataset.jsonl ]; then
            max_seed=$(jq -s 'map(.seed) | max' data-branch/dataset.jsonl)
            seed_start=$(( max_seed + 1 ))
          else
            seed_start=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "seed_start=$seed_start" >> "$GITHUB_OUTPUT"
          echo "Continuing from seed $seed_start (count $count)"

      - name: Run synthpass-bench (all profiles, round-robin)
        run: |
          cargo run -p synthpass-bench --release --bin synthpass-bench -- \
            --count ${{ steps.seed.outputs.count }} \
            --seed ${{ steps.seed.outputs.seed_start }} \
            --profile all \
            --out bench-report.json

      - name: Flatten this run's report into the dataset and commit
        env:
          SEED_START: ${{ steps.seed.outputs.seed_start }}
          COUNT: ${{ steps.seed.outputs.count }}
        run: |
          dataset="$PWD/data-branch/dataset.jsonl"
          jq -c --arg sha "$GITHUB_SHA" \
            '.timestamp_unix as $ts | .results[] | {run_timestamp_unix: $ts, git_sha: $sha, seed, profile, hit, reason: (.reason // null), elapsed_ms}' \
            bench-report.json > new-rows.jsonl
          cat new-rows.jsonl >> "$dataset"

          # The invariant the seed window is supposed to guarantee, checked
          # rather than assumed. (seed, profile) identifies a document and the
          # degradation applied to it; generation is deterministic from the
          # seed, so a repeat is a duplicate measurement that would silently
          # double-weight those rows for any future tuning. Refuse to publish
          # rather than append a corpus someone has to clean up later.
          check_no_duplicates() {
            dupes=$(jq -s '[group_by(.seed, .profile)[] | select(length > 1)] | length' "$dataset")
            if [ "$dupes" != "0" ]; then
              echo "::error::$dupes duplicate (seed, profile) pair(s) after this append — the seed window overlapped an earlier run. Not committing."
              exit 1
            fi
          }
          check_no_duplicates

          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset.jsonl
          # Only reachable if the bench produced no results at all — every real
          # row is textually unique (it carries this run's git_sha, timestamp
          # and timings), so this is not, and never was, a duplicate guard.
          if git diff --cached --quiet; then
            echo "no new rows, nothing to commit"
            exit 0
          fi
          total_rows=$(wc -l < dataset.jsonl)
          git commit -m "data: append run (seed $SEED_START, count $COUNT) — ${total_rows} rows total"

          # bench-charts.yml (through scripts/run-bench.ps1) also pushes to
          # bench-data, and this run fetched it about fifteen minutes ago. The
          # two write different files, so rebasing onto a newer tip cannot
          # conflict. Retry instead of dropping this run's rows on a rejected
          # push, and check the duplicate invariant again on the rebased file.
          for attempt in 1 2 3 4 5; do
            if git push origin bench-data; then
              exit 0
            fi
            echo "::warning::push to bench-data rejected (attempt $attempt of 5); rebasing onto its new tip"
            sleep $(( attempt * 20 ))
            git pull --rebase origin bench-data
            check_no_duplicates
          done
          echo "::error::could not push to bench-data after 5 attempts; this run's rows are kept in the bench-data-rows artifact"
          exit 1

      # A failed push must not lose the measured rows: keep them for 7 days,
      # the same rows the dataset would have received and nothing more.
      - name: Keep this run's rows when the commit or push failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bench-data-rows-${{ github.run_id }}
          path: new-rows.jsonl
          if-no-files-found: ignore
          retention-days: 7
