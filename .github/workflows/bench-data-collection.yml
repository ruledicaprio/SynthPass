name: Bench data collection

# Nightly, unattended synthetic measurement of all five MRZ formats (ADR-0027). It does NOT tune
# anything: it runs the M4 `synthpass-bench` corpus runner, projects the report to an allowlisted
# set of per-document values, and appends those rows to the `bench-data` branch.
#
# Per format (td1 td2 td3 mrva mrvb) and night, two slices:
#   fresh  200 documents, all five profiles, on a seed window that continues from the highest seed
#          that format already has, so no document is measured twice.
#   fixed  100 documents, `--profile clean --count 100 --seed 0` (the synthetic-headline
#          invocation), the same 100 every night, so a change to what the pipeline reads is a named
#          seed and not sampling noise.
# Both run with the shipped OCR defaults and budget (the nightly measures the product as shipped),
# and each run's header records the conditions it ran under.
#
# Rows go to new files, schema 2: `fresh.jsonl`, `fixed.jsonl`, `runs.jsonl` (one header per run).
# `dataset.jsonl` is frozen. Rows carry numbers, booleans and short class labels only: no `reason`,
# no field values, no OCR text, no pass readings. Seed and commit regenerate a document.
# See tools/bench_nightly_rows.py and
# knowledge/decisions/ADR-0027-ci-runners-measure-public-benchmark-arms.md.
#
# Trust boundary. The five `measure` jobs run whatever code this ref holds and have `contents:
# read`. The one job that can write `bench-data`, `publish`, runs only on `main` and only main's
# code: it fetches the commit it was started on, uses no third-party action (so there is nothing to
# pin), and holds `contents: write` and `actions: read`. On any other ref the rows go to an
# artifact instead (`dry-run`, `contents: read`): a dispatch from a branch can never write
# `bench-data`.
#
# The advisory (ADR-0027 decision 7). After the rows are appended, and before they are pushed,
# `tools/bench_nightly_advisory.py` reads the branch and reports what tonight changed: a job
# summary, one `::warning::` per flag, and one aggregate line appended to `advisory.jsonl` in the
# same commit as the rows. It turns the run red only for a severe fixed-slice flag or an invalid
# measurement, and only in the last step, after the push: a red advisory never loses the rows. It is
# never a required check and never opens an issue.
#
# Writes to a dedicated `bench-data` branch (not `main`, which is protected — see CONTRIBUTING.md)
# so this can push automatically without a PR per run.

on:
  schedule:
    - cron: "17 3 * * *" # ~daily, off the hour to avoid GitHub's cron rush
  workflow_dispatch:
    inputs:
      count:
        description: "Fresh documents per format this run (the fixed slice is always 100)"
        default: "200"

permissions:
  contents: read

# Per ref, so a dry run dispatched from a branch never queues behind, or cancels, main's nightly.
concurrency:
  group: bench-data-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure ${{ matrix.format }}
    runs-on: ubuntu-latest
    # ~300 documents; TD1 is the slowest format (about 4-7 s a document on a runner).
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        format: [td1, td2, td3, mrva, mrvb]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config clang libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the five formats: they build the same binary.
          shared-key: bench-data-collection

      - name: Cache OCR .rten models
        uses: actions/cache@v6
        with:
          path: |
            text-detection.rten
            text-recognition.rten
          key: ocrs-rten-models-v1

      - name: Download + checksum-verify the OCR .rten models
        run: |
          for f in text-detection.rten text-recognition.rten; do
            if [ ! -f "$f" ]; then
              curl -fL --retry 3 -o "$f" "https://ocrs-models.s3-accelerate.amazonaws.com/$f"
            fi
          done
          echo "f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca  text-detection.rten" | sha256sum -c -
          echo "e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e  text-recognition.rten" | sha256sum -c -

      # Read-only, anonymous: the repository is public, and no credential is in this job. Must run
      # BEFORE the seed window is picked: the window continues from what the branch already holds.
      - name: Read the bench-data branch
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          rc=0
          git ls-remote --exit-code --heads "$REPO_URL" bench-data >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0) git clone --quiet --depth 1 --branch bench-data --single-branch "$REPO_URL" data-branch ;;
            2) echo "no bench-data branch yet"; mkdir data-branch ;;
            *) echo "::error::could not list the bench-data branch (git exit $rc)"; exit 1 ;;
          esac

      # A fresh, monotonically-increasing seed window per format, continuing from the highest fresh
      # seed the branch already holds for it (and never below the frozen dataset.jsonl's highest
      # seed). Deriving the window from the data, not the calendar, has no one-run-a-day
      # assumption: on 2026-07-25 a manual dispatch landed beside the scheduled run, both drew the
      # same window, and 200 duplicate rows entered the corpus.
      - name: Pick this run's seed window
        id: plan
        # The dispatch input reaches the script through the environment, never through `${{ }}`
        # inside `run:`, which would splice it into the shell source.
        env:
          COUNT_INPUT: ${{ github.event.inputs.count }}
          FORMAT: ${{ matrix.format }}
        run: |
          count="${COUNT_INPUT:-200}"
          if ! [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::count must be a positive integer, got '$count'"
            exit 1
          fi
          # One `synthpass-bench` process renders every image of its run before the first OCR pass
          # (`generate_corpus`), so memory grows with --count: five formats at --count 1000 and at
          # --count 2000 each aborted in about 10 s on 15.7 GB, and a runner has about that much
          # (knowledge/benchmarks/synthetic-scale-2026-10-02.md, "Memory limit, as measured"). 200 is
          # the value that has run green nightly. Windowing generate_corpus is the real fix and is
          # not done here. The length test comes first, so a very long number never reaches the
          # numeric comparison, where `[` would error out and let it through.
          max_count=200
          if [ "${#count}" -gt "${#max_count}" ] || [ "$count" -gt "$max_count" ]; then
            echo "::error::count above $max_count is refused (got '$count'): it risks the measured out-of-memory abort, because generate_corpus renders every image of a run before the first OCR pass (knowledge/benchmarks/synthetic-scale-2026-10-02.md, 'Memory limit, as measured')"
            exit 1
          fi
          seed_start=$(python3 tools/bench_nightly_rows.py next-seed \
            --data-dir data-branch --document-type "$FORMAT")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "seed_start=$seed_start" >> "$GITHUB_OUTPUT"
          echo "$FORMAT: fresh window from seed $seed_start (count $count)"

      - name: Build synthpass-bench
        run: cargo build -p synthpass-bench --release --bin synthpass-bench

      # `--ocr-passes` is report-only: it adds each pass's id and outcome (and OCR text, which the
      # projection never copies) and changes no measured value. The reports are synthetic and are
      # kept for 3 days as an artifact (ADR-0027 decision 5).
      - name: Measure the fresh slice (all profiles, round-robin)
        env:
          FORMAT: ${{ matrix.format }}
          COUNT: ${{ steps.plan.outputs.count }}
          SEED_START: ${{ steps.plan.outputs.seed_start }}
        run: |
          target/release/synthpass-bench \
            --document-type "$FORMAT" --profile all \
            --count "$COUNT" --seed "$SEED_START" \
            --ocr-passes --out reports/fresh.json

      - name: Measure the fixed slice (the synthetic-headline invocation)
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          target/release/synthpass-bench \
            --document-type "$FORMAT" --profile clean \
            --count 100 --seed 0 \
            --ocr-passes --out reports/fixed.json

      - name: Record the run's conditions
        run: python3 tools/bench_nightly_rows.py context --out reports/context.json

      # `if: always()`: a failed slice must not lose the other one's report.
      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-nightly-${{ matrix.format }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 3

  # The only job that writes bench-data. Main only, main's code only.
  publish:
    name: Publish rows to bench-data
    needs: measure
    # Not `success()`: five formats should not lose a night to one flaky job. The last step fails
    # the run when any measurement failed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # `gh run download` lists this run's artifacts.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
    steps:
      # No `uses:` in this job. It fetches the commit this run started on, which on `main` is
      # main's code, and never the head of a branch.
      - name: Fetch main's code
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git init --quiet code
          git -C code fetch --quiet --depth 1 "$REPO_URL" "$GITHUB_SHA"
          git -C code checkout --quiet FETCH_HEAD

      # The advisory tells a generator change from noise by comparing the generator's tree at two
      # commits, so it needs the history behind this one. Best effort: without it the advisory warns
      # that it cannot decide, and never fails on it.
      - name: Fetch main's history for the generator check
        timeout-minutes: 10
        run: |
          git -C code fetch --quiet --unshallow "$REPO_URL" "$GITHUB_SHA" \
            || echo "::warning::could not fetch main's history; the advisory cannot tell a generator change"

      - name: Download this run's measurements
        env:
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --pattern 'bench-nightly-*' --dir artifacts

      # Allowlists every value, recomputes the derived flags from the rows and requires them to
      # equal each report's own counts. All or nothing: a mismatch fails the job.
      - name: Project the reports to schema-2 rows
        run: python3 code/tools/bench_nightly_rows.py assemble --artifacts artifacts --out new-rows

      - name: Append the rows to bench-data and push
        id: push
        run: |
          gh auth setup-git
          rc=0
          git ls-remote --exit-code --heads "$REPO_URL" bench-data >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0) git clone --quiet --depth 1 --branch bench-data --single-branch "$REPO_URL" data-branch ;;
            2) git init --quiet -b bench-data data-branch && git -C data-branch remote add origin "$REPO_URL" ;;
            *) echo "::error::could not list the bench-data branch (git exit $rc)"; exit 1 ;;
          esac
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat ../new-rows/fresh.jsonl >> fresh.jsonl
          cat ../new-rows/fixed.jsonl >> fixed.jsonl
          cat ../new-rows/runs.jsonl >> runs.jsonl

          # A fresh document is measured once: (document_type, seed, profile) is its key, and a
          # repeat would double-weight it. The fixed slice repeats by design. Checked again after
          # every rebase.
          python3 ../code/tools/bench_nightly_rows.py guard --file fresh.jsonl

          # The advisory reads the branch with tonight's rows already appended and appends one
          # aggregate line to advisory.jsonl, so that line travels in the same commit as the rows.
          # Its exit status is kept, not acted on here: the run goes red in the last step, after
          # the push, so a red night never loses its rows.
          advisory_rc=0
          python3 ../code/tools/bench_nightly_advisory.py \
            --data-dir . --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}" \
            --advisory-out advisory.jsonl --repo ../code || advisory_rc=$?
          echo "advisory_rc=$advisory_rc" >> "$GITHUB_OUTPUT"

          git add fresh.jsonl fixed.jsonl runs.jsonl
          if [ -f advisory.jsonl ]; then git add advisory.jsonl; fi
          if git diff --cached --quiet; then
            echo "no new rows, nothing to commit"
            exit 0
          fi
          fresh_rows=$(wc -l < ../new-rows/fresh.jsonl)
          fixed_rows=$(wc -l < ../new-rows/fixed.jsonl)
          git commit -m "data: nightly run ${GITHUB_RUN_ID} (${fresh_rows} fresh, ${fixed_rows} fixed rows)"

          # bench-charts.yml (through scripts/run-bench.ps1) also pushes to bench-data. The two
          # write different files, so rebasing onto a newer tip cannot conflict. Retry instead of
          # dropping this run's rows on a rejected push. If every attempt fails, the measurements
          # stay in this run's artifacts for 3 days: re-run this job.
          for attempt in 1 2 3 4 5; do
            if git push origin bench-data; then
              exit 0
            fi
            echo "::warning::push to bench-data rejected (attempt $attempt of 5); rebasing onto its new tip"
            sleep $(( attempt * 20 ))
            git pull --rebase origin bench-data
            python3 ../code/tools/bench_nightly_rows.py guard --file fresh.jsonl
          done
          echo "::error::could not push to bench-data after 5 attempts; re-run this job within 3 days"
          exit 1

      # After the push, so a red night still publishes its rows. `advisory_rc` is empty when the
      # push step never reached the advisory; that step's own failure already fails the run.
      - name: Fail the run if the advisory is red
        if: ${{ !cancelled() && steps.push.outputs.advisory_rc != '' && steps.push.outputs.advisory_rc != '0' }}
        env:
          ADVISORY_RC: ${{ steps.push.outputs.advisory_rc }}
        run: |
          echo "::error::the nightly advisory is red (exit $ADVISORY_RC); the rows were published, see the job summary"
          exit 1

      - name: Fail the run if a measurement failed
        if: ${{ !cancelled() && needs.measure.result != 'success' }}
        env:
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: |
          echo "::error::the measure jobs ended '$MEASURE_RESULT'; rows from the formats that finished were published"
          exit 1

  # Any other ref: the same projection, read-only, rows to an artifact and never to bench-data.
  dry-run:
    name: Dry run (rows to an artifact)
    needs: measure
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The advisory compares the generator at two commits, so it needs the history.
          fetch-depth: 0

      - name: Download this run's measurements
        env:
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --pattern 'bench-nightly-*' --dir artifacts

      - name: Project the reports to schema-2 rows
        run: |
          echo "Dry run on ${GITHUB_REF}: nothing is written to bench-data." >> "$GITHUB_STEP_SUMMARY"
          python3 tools/bench_nightly_rows.py assemble --artifacts artifacts --out would-be-rows
          wc -l would-be-rows/*.jsonl | tee -a "$GITHUB_STEP_SUMMARY"

      # Read-only and anonymous, like the measure jobs: the branch's history, with tonight's
      # would-be rows appended in a scratch copy, is what the advisory reads. Nothing is pushed.
      - name: Run the advisory on the would-be rows
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          rc=0
          git ls-remote --exit-code --heads "$REPO_URL" bench-data >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0) git clone --quiet --depth 1 --branch bench-data --single-branch "$REPO_URL" data-branch ;;
            2) echo "no bench-data branch yet"; mkdir data-branch ;;
            *) echo "::error::could not list the bench-data branch (git exit $rc)"; exit 1 ;;
          esac
          for f in fresh fixed runs; do cat "would-be-rows/$f.jsonl" >> "data-branch/$f.jsonl"; done
          advisory_rc=0
          python3 tools/bench_nightly_advisory.py \
            --data-dir data-branch --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}" \
            --advisory-out would-be-rows/advisory.jsonl --repo . || advisory_rc=$?
          echo "advisory exit status: $advisory_rc (a dry run never fails on it)"

      - name: Keep the would-be rows
        uses: actions/upload-artifact@v7
        with:
          name: nightly-would-be-rows
          path: would-be-rows/
          retention-days: 7

      - name: Fail the run if a measurement failed
        if: ${{ !cancelled() && needs.measure.result != 'success' }}
        env:
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: |
          echo "::error::the measure jobs ended '$MEASURE_RESULT'"
          exit 1
