name: Bench charts

# Regenerates the per-track trend charts (knowledge/img/*-bench-trend.svg,
# real-specimen provider-bench tracks and the five synthetic td1/td2/td3/
# mrva/mrvb tracks alike) plus the 5-way format comparison bar chart
# (knowledge/img/format-comparison.svg), on a schedule, and opens a PR with
# whatever changed. This is the CI counterpart to a developer running
# `scripts/run-bench.ps1 -Track <name>` by hand -- same script, same
# isolated-`git worktree` push to `bench-data`/`samples-data`, same "never
# touch main directly" rule (main is branch-protected by design, see
# CONTRIBUTING.md): this workflow only ever opens a PR, exactly like a human
# would, never pushes to main itself.

on:
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday, off the hour to avoid GitHub's cron rush
  workflow_dispatch:
    inputs:
      track:
        description: "Track to run (or 'all')"
        type: choice
        options: [all, passport, id_card, driving_license, real-specimens, td1, td2, td3, mrva, mrvb]
        default: all
      limit:
        description: "Cap on specimens per track (blank = every specimen)"
        default: ""

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: bench-charts
  cancel-in-progress: false

jobs:
  refresh-charts:
    name: Refresh trend charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config clang libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: Cache OCR .rten models
        uses: actions/cache@v6
        with:
          path: |
            text-detection.rten
            text-recognition.rten
          key: ocrs-rten-models-v1

      - name: Download + checksum-verify the OCR .rten models
        run: |
          for f in text-detection.rten text-recognition.rten; do
            if [ ! -f "$f" ]; then
              curl -fL --retry 3 -o "$f" "https://ocrs-models.s3-accelerate.amazonaws.com/$f"
            fi
          done
          echo "f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca  text-detection.rten" | sha256sum -c -
          echo "e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e  text-recognition.rten" | sha256sum -c -

      # provider-bench's llm provider needs the same real GGUF as ci.yml's
      # opt-in native-llm job.
      - name: Download + checksum-verify the GGUF model
        run: |
          MODEL_URL="https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          MODEL_SHA256="6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e"
          curl -fL --retry 3 -o qwen2.5-1.5b-instruct-q4_k_m.gguf "$MODEL_URL"
          echo "$MODEL_SHA256  qwen2.5-1.5b-instruct-q4_k_m.gguf" | sha256sum -c -

      # scripts/sync-samples.ps1 and scripts/run-bench.ps1 both commit inside
      # isolated worktrees (samples-data / bench-data) -- a fresh runner has
      # no git identity configured, unlike a developer's machine.
      - name: Configure git identity for the sync/bench scripts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve the pinned samples-data revision
        id: resolve_data
        if: ${{ github.event_name == 'schedule' || github.event.inputs.track == '' || github.event.inputs.track == 'all' || contains('passport,id_card,driving_license,real-specimens', github.event.inputs.track) }}
        continue-on-error: ${{ github.event_name == 'schedule' || github.event.inputs.track == '' || github.event.inputs.track == 'all' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pin=$(python -c 'import json; print(json.load(open("knowledge/benchmarks/real-specimen-mrz-baseline.json"))["samples_data_sha"])')
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ baseline samples_data_sha is not a full commit SHA: $pin" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/samples-data:refs/remotes/origin/samples-data"
          if ! git cat-file -e "$pin^{commit}" && [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            # checkout@v7 is shallow by default; deepen only when the pinned
            # baseline commit is older than the branch tip.
            git fetch --unshallow --no-tags origin "+refs/heads/samples-data:refs/remotes/origin/samples-data"
          fi
          if ! git cat-file -e "$pin^{commit}"; then
            echo "❌ pinned samples-data commit is unavailable: $pin" >&2
            exit 1
          fi
          tip=$(git rev-parse refs/remotes/origin/samples-data)
          echo "Pinned samples-data: $pin (remote tip: $tip)"
          echo "SAMPLES_DATA_SHA=$pin" >> "$GITHUB_ENV"
          echo "SAMPLES_DATA_TIP=$tip" >> "$GITHUB_ENV"

      - name: Reconcile the pinned real-specimen population
        id: reconcile_data
        if: steps.resolve_data.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'schedule' || github.event.inputs.track == '' || github.event.inputs.track == 'all' }}
        run: |
          python tools/audit_benchmark_identity.py --check --data-ref-source "committed baseline" --output artifacts/identity-audit.json

      # Synthetic tracks do not consume samples-data, but this workflow also
      # runs real tracks. Materialize the exact baseline corpus so chart history
      # remains comparable to the measured gate population.
      - name: Pull the pinned samples corpus
        id: sync_data
        if: steps.reconcile_data.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'schedule' || github.event.inputs.track == '' || github.event.inputs.track == 'all' }}
        shell: pwsh
        run: ./scripts/sync-samples.ps1 -DataRef $env:SAMPLES_DATA_SHA

      - name: Run bench track(s)
        shell: pwsh
        env:
          TRACK_INPUT: ${{ github.event.inputs.track || 'all' }}
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
        run: |
          # "all" runs every track: the four real-specimen (provider-bench)
          # tracks plus the five synthetic (synthpass-bench) tracks (M6's
          # td1/td2/td3 plus MRV-A/MRV-B visas). The synthetic tracks are a
          # different axis from `passport` -- see scripts/run-bench.ps1's
          # module doc comment on why the two are not the same thing despite
          # the acronym overlap.
          $runAll = $env:TRACK_INPUT -eq 'all' -or [string]::IsNullOrEmpty($env:TRACK_INPUT)
          $realTracks = @("passport", "id_card", "driving_license", "real-specimens")
          $syntheticTracks = @("td1", "td2", "td3", "mrva", "mrvb")
          $realRequested = $runAll -or $env:TRACK_INPUT -in $realTracks
          $realReady = -not $realRequested -or ("${{ steps.reconcile_data.outcome }}" -eq 'success' -and "${{ steps.sync_data.outcome }}" -eq 'success')
          if ($runAll) {
            if ($realReady) {
              $tracks = $realTracks + $syntheticTracks
            } else {
              Write-Warning "Pinned real-specimen reconciliation failed; continuing with synthetic tracks only."
              $tracks = $syntheticTracks
            }
          } else {
            $tracks = @($env:TRACK_INPUT)
          }

          foreach ($track in $tracks) {
            Write-Host "=== Track: $track ===" -ForegroundColor Cyan
            $benchArgs = @{ Track = $track }
            if (-not [string]::IsNullOrEmpty($env:LIMIT_INPUT)) {
              $benchArgs["Limit"] = [int]$env:LIMIT_INPUT
            }
            ./scripts/run-bench.ps1 @benchArgs
            if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) {
              throw "run-bench.ps1 -Track $track failed (exit $LASTEXITCODE)"
            }
          }

          # Regenerate the 5-way format comparison chart in the same step the
          # per-track trend charts above were regenerated, so it never goes
          # stale relative to them -- only when at least one synthetic track
          # actually ran this time (a passport-only dispatch has no reason to
          # touch it).
          $syntheticTracksRun = $tracks | Where-Object { $_ -in @("td1", "td2", "td3", "mrva", "mrvb") }
          if ($syntheticTracksRun.Count -gt 0) {
            Write-Host "=== Regenerating knowledge/img/format-comparison.svg ===" -ForegroundColor Cyan
            git fetch origin bench-data
            $histDir = Join-Path $env:RUNNER_TEMP "bench-histories"
            New-Item -ItemType Directory -Force -Path $histDir | Out-Null
            $seriesArgs = @()
            foreach ($fmt in @("td1", "td2", "td3", "mrva", "mrvb")) {
              $histFile = Join-Path $histDir "$fmt-history.jsonl"
              git show "origin/bench-data:results/$fmt-bench/history.jsonl" > $histFile 2>$null
              if ((Test-Path $histFile) -and (Get-Item $histFile).Length -gt 0) {
                $seriesArgs += @("--series", "$($fmt.ToUpper())=$histFile")
              } else {
                Write-Host "  (no results/$fmt-bench/history.jsonl on bench-data yet -- skipping that bar)"
              }
            }
            if ($seriesArgs.Count -gt 0) {
              cargo run -p synthpass-bench --release --bin bench-chart -- --bars @seriesArgs --out knowledge/img/format-comparison.svg
              if ($LASTEXITCODE -ne 0) {
                throw "bench-chart --bars failed (exit $LASTEXITCODE)"
              }
            }
          }

      - name: Compare with the previous successful bench run
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # Advisory only, including missing/expired artifacts and bad reports.
          # Never emit report fields, OCR text, or external command diagnostics.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Note([string]$text) {
            Write-Host $text
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $text
          }
          try {
            $runsJson = & gh run list --workflow bench-charts.yml --status success --limit 2 --json databaseId 2>$null
            if ($LASTEXITCODE -ne 0) {
              Note 'Weekly diff: previous successful runs unavailable.'
              exit 0
            }
            $previous = @($runsJson | ConvertFrom-Json) | Where-Object { "$($_.databaseId)" -ne $env:CURRENT_RUN_ID } | Select-Object -First 1
            if ($null -eq $previous) {
              Note 'Weekly diff: no previous successful run.'
              exit 0
            }
            $previousDir = Join-Path $env:RUNNER_TEMP 'prev'
            & gh run download $previous.databaseId -n "bench-reports-$($previous.databaseId)" -D $previousDir *> $null
            if ($LASTEXITCODE -ne 0) {
              Note 'Weekly diff: previous artifact unavailable or expired.'
              exit 0
            }
            $diffDir = 'artifacts/weekly-diff'
            New-Item -ItemType Directory -Force -Path $diffDir | Out-Null
            Note "## Weekly bench diff (previous run $($previous.databaseId))"
            foreach ($track in @('td1', 'td2', 'td3', 'mrva', 'mrvb')) {
              $name = "$track-synthpass-bench-report.json"
              $before = Join-Path $previousDir $name
              $after = Join-Path 'artifacts' $name
              if (-not (Test-Path $after)) { continue }
              if (-not (Test-Path $before)) {
                Note "${track}: previous report missing; nothing to compare."
                continue
              }
              try {
                # Default text output includes recognized field values. Read
                # JSON privately, then allow only counts, seeds and classes.
                $diffJson = & python tools/synth_ab_diff.py $before $after --json 2>$null
                if ($LASTEXITCODE -ne 0) {
                  Note "${track}: reports unreadable or corpora differ; not compared."
                  continue
                }
                $diff = $diffJson | ConvertFrom-Json
                $lines = @()
                foreach ($key in @('hits', 'correct', 'wrong_accepts', 'valid_misses', 'count')) {
                  $lines += "${key}: $([long]$diff.before.$key) -> $([long]$diff.after.$key)"
                }
                $classPattern = '^(correct|wrong|valid-miss|refused) -> (correct|wrong|valid-miss|refused)$'
                foreach ($class in $diff.classes.PSObject.Properties) {
                  if ($class.Name -notmatch $classPattern) { throw 'Unexpected class' }
                  $lines += "$($class.Name): $([long]$class.Value)"
                }
                foreach ($moved in $diff.moved) {
                  if ($moved.class -notmatch $classPattern) { throw 'Unexpected class' }
                  $lines += "seed $([long]$moved.seed): $($moved.class)"
                }
                Set-Content -LiteralPath (Join-Path $diffDir "$track.txt") -Value $lines -Encoding utf8
                Note "### $track"
                Note ('```text' + "`n" + ($lines -join "`n") + "`n" + '```')
              } catch {
                Note "${track}: comparison unavailable; not compared."
              }
            }
            foreach ($track in @('passport', 'id_card', 'driving_license', 'real-specimens')) {
              $name = "$track-provider-bench-report.json"
              $before = Join-Path $previousDir $name
              $after = Join-Path 'artifacts' $name
              if (-not (Test-Path $after)) { continue }
              if (-not (Test-Path $before)) {
                Note "${track}: previous report missing; not compared."
                continue
              }
              # provider-bench's Report has count and providers, but no
              # top-level hit count. Do not invent one from provider rates.
              try {
                $oldReport = Get-Content -LiteralPath $before -Raw | ConvertFrom-Json
                $newReport = Get-Content -LiteralPath $after -Raw | ConvertFrom-Json
                if ($oldReport.tier1_hits -is [long] -and $newReport.tier1_hits -is [long]) {
                  Note "${track}: tier1_hits $($oldReport.tier1_hits) -> $($newReport.tier1_hits) (top-level key)."
                } else {
                  Note "${track}: not compared (no top-level hit-count key in provider-bench reports)."
                }
              } catch {
                Note "${track}: reports unreadable; not compared."
              }
            }
          } catch {
            Note 'Weekly diff unavailable; benchmark results are unaffected.'
          }
          exit 0

      - name: Preserve the identity audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-identity-audit-${{ github.run_id }}
          path: artifacts/identity-audit.json
          if-no-files-found: ignore

      # `if: always()` is the whole point: the 2026-08-03 failure came *after*
      # an hour of benching, with the reports written and then thrown away when
      # the runner was destroyed. Keeping them turns "re-run the whole job" into
      # `run-bench.ps1 -Track <t> -FromReport <file>`, which the script already
      # supports for exactly this. Cheap insurance -- these are tens of KB.
      - name: Preserve the raw bench reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-reports-${{ github.run_id }}
          path: |
            artifacts/*-report.json
            artifacts/weekly-diff/
          if-no-files-found: ignore
          retention-days: 30

      # The README's specimen image is the generator's own output for the
      # command the README shows (seed 1, TD1, clean profile), so it is
      # regenerated here rather than hand-captured, and a generator change
      # that alters it shows up in this workflow's PR like any chart change.
      - name: Regenerate the README specimen
        run: |
          cargo run -p synthpass-cli --release -- generate --document-type td1 --count 1 --seed 1 --profile clean --out-dir "$RUNNER_TEMP/specimen"
          cp "$RUNNER_TEMP/specimen/synthpass_1_td1.png" knowledge/img/synthetic_pass_example.png

      - name: Open a PR if any chart changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- knowledge/img/*.svg knowledge/img/synthetic_pass_example.png; then
            echo "No chart changes -- nothing to PR."
            exit 0
          fi

          branch="bench-charts/$(date +%Y-%m-%d)-${{ github.run_number }}"
          git checkout -b "$branch"
          git add knowledge/img/*.svg knowledge/img/synthetic_pass_example.png
          git commit -m "chore(bench): refresh trend charts ($(date +%Y-%m-%d))"
          git push origin "$branch"

          gh pr create \
            --title "chore(bench): refresh trend charts ($(date +%Y-%m-%d))" \
            --body "Automated chart refresh from the \`bench-charts\` workflow (run ${{ github.run_id }}). Regenerated by \`scripts/run-bench.ps1\` against the current \`samples-data\` corpus and \`bench-data\` history — same script a human runs locally, just scheduled. Review the diff before merging, same as any other chart update (see knowledge/benchmarks/README.md)." \
            --base main \
            --head "$branch"
