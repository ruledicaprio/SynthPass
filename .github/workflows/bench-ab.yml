name: Bench A/B (synthetic)

# A before/after A/B of two refs on the five synthetic MRZ formats, both arms on ONE runner, one
# after the other, from binaries built in this run (ADR-0027 decisions 3, 4, 5 and 8, build-order
# item 5). It is a dispatch and nothing else: it never runs on a schedule or a pull request, and
# it is never a gate. Its verdict is advisory and about reads, not speed: no timing is a result.
#
# What it measures. For each of the formats, `synthpass-bench --document-type F --profile P
# --count N --seed S --dump-ocr` on the before arm and then on the after arm, and then
# `tools/bench_ab_diff.py` over the two directories: hits, accepted reads, wrong accepts and every
# seed whose read moved, seed by seed. Each arm may set measurement knobs (`before_env`,
# `after_env`: NAME=VALUE pairs from the allowlist in tools/bench_ab_args.py) so that one binary
# can be A/B'd against itself, for example `SYNTHPASS_OCR_ORDER=band-first` against nothing.
#
# The budget is pinned. `SYNTHPASS_OCR_MAX_SECONDS=600` is set by this workflow on both arms and
# cannot be set by a dispatcher. The OCR retry loop stops on elapsed time (shipped default 52 s),
# so on a slower or busier runner it would read a document differently with no code change. On a
# synthetic document the budget has never bound (the slowest of 14,110 nightly documents took
# 15.7 s), so a budget far above it removes machine speed from the diff. A change whose value
# depends on the budget is measured locally, not here. The pin makes this a different
# configuration from the shipped one, so a CI arm is never compared with a local arm.
#
# Trust boundary.
# - The job holds `contents: read` and no secret. Nothing in it can push, comment or write to the
#   repository, and every checkout has `persist-credentials: false`, so no token is left in a
#   `.git/config` for the code under test to read.
# - The two arms run whatever code their refs hold (build scripts and the bench binary), in the
#   same job as the tools that diff them. A ref that meant to could therefore falsify its own
#   diff. Treat the result as evidence about a change you already trust to run, never as
#   authorisation for one you do not.
# - A dispatch input is text a person typed. The FIRST step, `tools/bench_ab_args.py validate`,
#   reads every raw input through the environment, refuses anything outside a small grammar
#   (ref names, an allowlist of knobs, five formats, a profile, bounded integers) and writes a
#   normalized plan. No later step reads a raw input, and no `${{ }}` expression sits inside a
#   `run:` script, which would splice text into the shell source. The arms' NAME=VALUE pairs are
#   applied by `bench_ab_args.py run` from the plan through `subprocess`, never split by a shell.
#
# Publication. The reports, each arm's standard output and the full diff hold synthetic OCR zone
# text, so they go ONLY into one artifact kept 3 days (ADR-0027 decision 5). The job log and the
# step summary carry counts only: the two arms' refs, commits, knobs and binary hashes, the diff's
# per-format summary lines (the lines that start `<format>.json:`, which hold counts) and the
# verdict. `--dump-ocr` prints OCR text to standard output, so it is redirected to a file, and the
# full diff is never printed. (A job log lives 90 days.) Under `expect_identical` the diff's own
# neutrality output is printed too: it names counts, seeds and hash prefixes and never a line of
# text, by its contract (tools/bench_ab_diff.py, "Neutrality mode").
#
# Scope. The five synthetic formats only. The public real-specimen corpus arm is a follow-up: its
# artifacts and log must first be proven text-free (ADR-0027 decision 5: CI never dumps real
# OCR text, not even as a short-lived artifact). tools/bench_ab_diff.py compares arms measured on
# different machines without complaint today; that refusal is build-order item 6. Until then each
# arm's `arm.json` records the runner (its `context` block is the nightly's), and the two arms of
# this job share one.
#
# Verify the workflow with an A/A dispatch: the same ref in both arms and `expect_identical`
# true. Both arms then run the same code with the same knobs, and the job must end NEUTRAL:
#   gh workflow run bench-ab.yml --ref <branch> -f before_ref=main -f after_ref=main \
#     -f expect_identical=true -f count=20
# A red A/A means the harness moved a read (a wall-clock effect, or a nondeterministic step), and
# no A/B from this workflow means anything until it is understood.

on:
  workflow_dispatch:
    inputs:
      before_ref:
        description: "Before arm: a branch, tag or commit of this repository"
        default: "main"
      after_ref:
        description: "After arm: a branch, tag or commit of this repository"
        required: true
      before_env:
        description: "Before arm knobs, space-separated NAME=VALUE from the allowlist (empty: shipped defaults)"
        default: ""
      after_env:
        description: "After arm knobs, space-separated NAME=VALUE from the allowlist (empty: shipped defaults)"
        default: ""
      formats:
        description: "Formats to measure: any of td1 td2 td3 mrva mrvb, space or comma separated"
        default: "td1 td2 td3 mrva mrvb"
      profile:
        description: "Degradation profile: clean mobile scanner worn border-kiosk damaged all"
        default: "clean"
      count:
        description: "Documents per format and arm (1 to 500)"
        default: "100"
      seed:
        description: "First seed (0 to 4294967295)"
        default: "0"
      expect_identical:
        description: "A/A mode: run the diff with --expect-identical and fail the job unless every read is the same"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ab:
    name: A/B on one runner
    runs-on: ubuntu-latest
    # The default run is 5 formats x 2 arms x 100 documents. TD1 is the slowest format (about
    # 4-7 s a document on a runner, the nightly's own figure), so measuring takes at most
    # 5 x 2 x 100 x 7 s = 7,000 s, about 117 min, and the other four formats are faster. The two
    # release builds and the setup are budgeted at 40 min from a cold cache (an estimate, not a
    # measurement: the second build recompiles only the workspace crates, the shared target
    # directory holds the dependencies). About 160 min at the worst, so 300 leaves nearly twice
    # that. With all five formats at TD1 speed, a count above about 220 (300 - 40 min, over
    # 70 s per count) can outrun it. A timeout fails the job and the artifact is still uploaded,
    # but a timed-out run is not a result: narrow `formats` or lower `count`.
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      # One target directory for both builds, so the second build reuses the first's dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      # The dispatching ref's own checkout: its tools/ validate the inputs and diff the arms.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The first step that reads a dispatch input, and the only one. The raw inputs arrive through
      # the environment, never through `${{ }}` inside `run:`. Its outputs are validated values, so
      # later steps may use them in `with:` and `env:`.
      - name: Validate the dispatch inputs
        id: plan
        env:
          AB_BEFORE_REF: ${{ github.event.inputs.before_ref }}
          AB_AFTER_REF: ${{ github.event.inputs.after_ref }}
          AB_BEFORE_ENV: ${{ github.event.inputs.before_env }}
          AB_AFTER_ENV: ${{ github.event.inputs.after_env }}
          AB_FORMATS: ${{ github.event.inputs.formats }}
          AB_PROFILE: ${{ github.event.inputs.profile }}
          AB_COUNT: ${{ github.event.inputs.count }}
          AB_SEED: ${{ github.event.inputs.seed }}
          AB_EXPECT_IDENTICAL: ${{ github.event.inputs.expect_identical }}
        run: python3 tools/bench_ab_args.py validate --plan ab/plan.json --github-output "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config clang libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # Its own cache: the nightly's `bench-data-collection` cache is keyed to one Cargo.lock,
          # and this workflow's lock is whatever the dispatching ref holds.
          shared-key: bench-ab

      - name: Cache OCR .rten models
        uses: actions/cache@v6
        with:
          path: |
            text-detection.rten
            text-recognition.rten
          key: ocrs-rten-models-v1

      - name: Download + checksum-verify the OCR .rten models
        run: |
          for f in text-detection.rten text-recognition.rten; do
            if [ ! -f "$f" ]; then
              curl -fL --retry 3 -o "$f" "https://ocrs-models.s3-accelerate.amazonaws.com/$f"
            fi
          done
          echo "f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca  text-detection.rten" | sha256sum -c -
          echo "e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e  text-recognition.rten" | sha256sum -c -

      # Each arm in its own directory. `ref` is a validated output, and it is a `with:` value, not
      # shell text.
      - name: Check out the before arm
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.before_ref }}
          path: arm-before
          persist-credentials: false

      - name: Check out the after arm
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.after_ref }}
          path: arm-after
          persist-credentials: false

      - name: Resolve both refs to commits
        id: shas
        run: |
          echo "before=$(git -C arm-before rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "after=$(git -C arm-after rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Each arm's binary is copied out of the shared target directory the moment it is built, and
      # each arm runs from its own copy (`bin/<role>/`), so neither can pick up the other's. The
      # model files are copied beside each arm's sources: a bench built from a tree looks there.
      - name: Build the before arm
        working-directory: arm-before
        run: cargo build -p synthpass-bench --release --bin synthpass-bench

      - name: Keep the before binary
        run: |
          mkdir -p bin/before
          cp "$CARGO_TARGET_DIR/release/synthpass-bench" bin/before/synthpass-bench
          cp text-detection.rten text-recognition.rten arm-before/

      - name: Build the after arm
        working-directory: arm-after
        run: cargo build -p synthpass-bench --release --bin synthpass-bench

      - name: Keep the after binary
        run: |
          mkdir -p bin/after
          cp "$CARGO_TARGET_DIR/release/synthpass-bench" bin/after/synthpass-bench
          cp text-detection.rten text-recognition.rten arm-after/

      # For each format, the before arm and then the after arm, so a slow patch of the runner
      # falls on both. `bench_ab_args.py run` applies each arm's knobs and the pinned budget from
      # the plan; it writes the report and the raw OCR text (`--dump-ocr`) under ab/<role>/ and
      # prints one line per run. The formats are validated tokens (letters and digits).
      - name: Measure both arms
        env:
          FORMATS: ${{ steps.plan.outputs.formats }}
        run: |
          for format in $FORMATS; do
            for role in before after; do
              python3 tools/bench_ab_args.py run --plan ab/plan.json \
                --role "$role" --format "$format" \
                --binary "bin/$role/synthpass-bench" --cwd "arm-$role" --out-dir "ab/$role"
            done
          done

      - name: Record both arms
        env:
          BEFORE_SHA: ${{ steps.shas.outputs.before }}
          AFTER_SHA: ${{ steps.shas.outputs.after }}
        run: |
          python3 tools/bench_ab_args.py arm-json --plan ab/plan.json --role before \
            --git-sha "$BEFORE_SHA" --binary bin/before/synthpass-bench --out ab/before/arm.json
          python3 tools/bench_ab_args.py arm-json --plan ab/plan.json --role after \
            --git-sha "$AFTER_SHA" --binary bin/after/synthpass-bench --out ab/after/arm.json

      # The full diff (zone text and all) goes to ab/diff.txt and ab/diff.json, which are in the
      # artifact and nowhere else. Exit 0: an A/B; 1: not an A/B (different documents, or a report
      # that disagrees with its own counts); 2: unreadable.
      - name: Diff the arms
        env:
          EXPECT_IDENTICAL: ${{ steps.plan.outputs.expect_identical }}
        run: |
          set -o pipefail
          {
            echo "### Bench A/B"
            echo '```'
            python3 tools/bench_ab_args.py summary --plan ab/plan.json \
              --before ab/before/arm.json --after ab/after/arm.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          rc=0
          python3 tools/bench_ab_diff.py ab/before ab/after > ab/diff.txt || rc=$?
          python3 tools/bench_ab_diff.py ab/before ab/after --json > ab/diff.json || true

          # Counts only: the per-format summary line and any "not an A/B" line, both text-free.
          {
            echo '```'
            grep -E '^(NOT AN A/B: |[a-z0-9]+\.json: )' ab/diff.txt || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            echo "::error::the arms are not an A/B (bench_ab_diff exit $rc); nothing here is a result"
            exit 1
          fi

          if [ "$EXPECT_IDENTICAL" = "true" ]; then
            nrc=0
            python3 tools/bench_ab_diff.py ab/before ab/after --expect-identical > ab/neutral.txt || nrc=$?
            python3 tools/bench_ab_diff.py ab/before ab/after --expect-identical --json > ab/neutral.json || true
            # Text-free by the mode's contract: counts, seeds, asset ids, hash prefixes.
            { echo '```'; cat ab/neutral.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            case "$nrc" in
              0) echo "A/A verdict: NEUTRAL" | tee -a "$GITHUB_STEP_SUMMARY" ;;
              3) echo "::error::NOT NEUTRAL: the same ref read differently in the two arms (see the summary)"; exit 1 ;;
              *) echo "::error::bench_ab_diff --expect-identical failed (exit $nrc)"; exit 1 ;;
            esac
          else
            echo "A/B compared; the full diff is in the bench-ab artifact (kept 3 days)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # `if: always()`: a failed diff or a timed-out arm still leaves what was measured. 3 days,
      # because the files hold synthetic OCR text (ADR-0027 decision 5).
      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ab
          path: ab/
          if-no-files-found: ignore
          retention-days: 3
