name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Enable full output to see the actual error in logs
          show_full_output: true

          # Optional: Give a custom prompt. 
          # If the comment is vague, this fallback kicks in.
          # The comment body is still used if it's non-empty.
          prompt: |
            You are assisting with a GitHub issue or comment. 
            The user said: "${{ github.event.comment.body || github.event.issue.body || github.event.review.body }}"
            If the request is vague, ask clarifying questions. 
            If it's a clear implementation request, provide a step‑by‑step plan (do not modify workflow files as this is disallowed).
            Always respond in a helpful, technical manner.

          additional_permissions: |
            actions: read

          # Add verbose logging to help debug future issues
          claude_args: '--verbose'
