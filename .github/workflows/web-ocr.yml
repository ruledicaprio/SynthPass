name: Web OCR corpus measurement

# Measures the browser MRZ validator's checksum-valid hit rate over the
# specimen corpus, in real Chromium, against the native pipeline's recorded
# result for the same documents. See tests/web/README.md.
#
# Deliberately NOT a pull-request gate: a full sweep takes 20-30 minutes and
# needs the orphan samples-data branch, so it runs on demand and nightly —
# the same posture crates/synthpass-llm/tests/parity.rs has as `#[ignore]`d.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max specimens to scan (blank = all)'
        required: false
        type: string
      floor:
        description: 'Fail if the hit rate drops below this fraction (e.g. 0.30)'
        required: false
        type: string
      reference_tag:
        description: 'Release tag that anchors the comparison (default: v1.5.0)'
        required: false
        default: v1.5.0
        type: string
  schedule:
    # 04:20 UTC daily — after the bench jobs, well clear of the Pages deploy.
    - cron: '20 4 * * *'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # The baseline pin is the benchmark input. Never substitute the
      # moving samples-data branch tip when measuring.
      - name: Resolve pinned specimen corpus
        shell: bash
        run: |
          set -euo pipefail
          DATA_SHA="$(python -c 'import json; print(json.load(open("knowledge/benchmarks/real-specimen-mrz-baseline.json"))["samples_data_sha"])')"
          if [[ ! "$DATA_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "baseline samples_data_sha is not a full commit SHA: $DATA_SHA" >&2
            exit 1
          fi
          git fetch --tags --unshallow origin 2>/dev/null || git fetch --tags origin
          REFERENCE_TAG="${{ inputs.reference_tag }}"
          REFERENCE_TAG="${REFERENCE_TAG:-v1.5.0}"
          REFERENCE_TAG_SHA="$(git rev-parse "refs/tags/$REFERENCE_TAG^{commit}" 2>/dev/null || true)"
          if [[ -z "$REFERENCE_TAG_SHA" ]] || ! git merge-base --is-ancestor "$REFERENCE_TAG_SHA" HEAD; then
            echo "$REFERENCE_TAG must exist and be an ancestor before Phase D measurement" >&2
            exit 1
          fi
          echo "PHASE_D_REFERENCE_TAG=$REFERENCE_TAG" >> "$GITHUB_ENV"
          echo "PHASE_D_REFERENCE_TAG_SHA=$REFERENCE_TAG_SHA" >> "$GITHUB_ENV"
          git fetch --no-tags origin samples-data
          git cat-file -e "$DATA_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$DATA_SHA"
          git cat-file -e "$DATA_SHA^{commit}"
          echo "SAMPLES_DATA_SHA=$DATA_SHA" >> "$GITHUB_ENV"
          echo "using samples-data commit $DATA_SHA"
      - name: Audit pinned corpus identity
        run: |
          mkdir -p artifacts
          python tools/audit_benchmark_identity.py --check --data-ref "$SAMPLES_DATA_SHA" --data-ref-source "committed baseline" --output artifacts/identity-audit.json
      - name: Materialize pinned specimen corpus
        run: |
          git checkout "$SAMPLES_DATA_SHA" -- samples
          echo "specimen images: $(find samples -type f \( -name '*.jpg' -o -name '*.png' -o -name '*.webp' -o -name '*.jpeg' -o -name '*.bmp' -o -name '*.gif' \) | wc -l)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache OCR .rten models
        uses: actions/cache@v4
        with:
          path: |
            text-detection.rten
            text-recognition.rten
          key: ocrs-rten-models-v1
      - name: Download + checksum-verify the OCR .rten models
        run: |
          set -euo pipefail
          for f in text-detection.rten text-recognition.rten; do
            test -f "$f" || curl -fL --retry 3 -o "$f" "https://ocrs-models.s3-accelerate.amazonaws.com/$f"
          done
          echo "f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca  text-detection.rten" | sha256sum -c -
          echo "e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e  text-recognition.rten" | sha256sum -c -

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: Assemble the site
        run: bash scripts/build-site.sh _site

      - name: Install harness
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Measure native MRZ provider
        env:
          SYNTHPASS_OCR_MAX_PASSES: "14"
          SYNTHPASS_OCR_MAX_SECONDS: "52"
          SYNTHPASS_OCR_ORDER: "default"
          SYNTHPASS_OCR_TEXTURE: "on"
          SYNTHPASS_OCR_SKEW: "default"
          SYNTHPASS_OCR_ROTATE: "default"
        run: |
          cargo run -p synthpass-bench --release --bin provider-bench -- --real-specimens --mrz-only --progress --out artifacts/native-provider-bench-report.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          report_path = Path("artifacts/native-provider-bench-report.json")
          baseline_path = Path("knowledge/benchmarks/real-specimen-mrz-baseline.json")
          report = json.loads(report_path.read_text())
          baseline = json.loads(baseline_path.read_text())
          report["provenance"] = {
              "main_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "samples_data_sha": os.environ["SAMPLES_DATA_SHA"],
              "baseline_samples_data_sha": baseline["samples_data_sha"],
              "baseline_sha256": hashlib.sha256(baseline_path.read_bytes()).hexdigest(),
              "baseline_measured_on_ci_sha": baseline.get("measured_on_ci_sha"),
              "reference_tag": os.environ["PHASE_D_REFERENCE_TAG"],
              "reference_tag_sha": os.environ["PHASE_D_REFERENCE_TAG_SHA"],
              "native_retry_max_passes": int(os.environ["SYNTHPASS_OCR_MAX_PASSES"]),
              "native_retry_budget_seconds": int(os.environ["SYNTHPASS_OCR_MAX_SECONDS"]),
              "native_retry_order": os.environ["SYNTHPASS_OCR_ORDER"],
              "native_retry_texture": os.environ["SYNTHPASS_OCR_TEXTURE"],
              "native_retry_skew": os.environ["SYNTHPASS_OCR_SKEW"],
              "native_retry_rotate": os.environ["SYNTHPASS_OCR_ROTATE"],
          }
          report_path.write_text(json.dumps(report, indent=2) + chr(10))
          PY

      - name: Measure
        run: |
          ARGS="--out web-ocr-report.json"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ -n "${{ inputs.floor }}" ] && ARGS="$ARGS --floor ${{ inputs.floor }}"
          node tests/web/run-corpus.mjs --native-report artifacts/native-provider-bench-report.json $ARGS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ocr-report
          path: |
            web-ocr-report.json
            artifacts/identity-audit.json
            artifacts/native-provider-bench-report.json
          if-no-files-found: warn
