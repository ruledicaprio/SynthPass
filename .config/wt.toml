# git-wt (Worktrunk) project configuration.
#
# Worktrees are this project's isolation layer: agents, A/B arms and parallel
# sessions all run in one. A worktree without the specimen images is not merely
# inconvenient -- it fails silently. On 2026-09-18 the MRZ matrix probe ran in a
# fresh worktree, found 5 of 232 fixtures had a locatable image, and reported a
# per-cell accuracy gap of 3.8 pp. Re-run with the full corpus the gap was
# 0.96 pp. The small run was not wrong about its own 395 cells; it was wrong
# about what they meant, and nothing in the output said so.
#
# So the corpus is copied automatically. What gets copied is an allowlist in
# .worktreeinclude -- notably NOT target/ (129 GB on this machine) and NOT
# samples/private/ (real PII, opt-in via --include-private only).

# Schema note: hooks are TOP-LEVEL keys, not a [hooks] table, and the value is a
# string. A [hooks] table parses as an unknown key, is silently ignored, and the
# corpus then does not arrive -- reintroducing the exact silent failure above.
# Verify with `git-wt hook show`, which must list post-switch.
#
# A project hook also needs a one-shot approval per machine before it will run
# (`git-wt config approvals add`). Until that is granted the hook is listed but
# skipped, so a fresh worktree still arrives empty. Check with
# `git-wt config approvals list`.
#
# And the hook's subprocess inherits the invoking shell's PATH. From Git Bash,
# whose MSYS PATH lacks the Git-for-Windows cmd directory, the spawned copy dies
# with "Git for Windows is required but not found" -- while git-wt still reports
# the switch as successful. Create worktrees from PowerShell.
#
# All three failures are silent. After creating a worktree, count the files:
# it should carry the full samples/ tree, not just the tracked part.
post-switch = "git-wt step copy-ignored --require-include"
